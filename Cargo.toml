[package]
name = "rust_tetris"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = "0.4.4"
rodio = "0.20.1"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gilrs = "0.11.0"  # Check for the latest version at https://crates.io/crates/gilrs

[profile.release]
opt-level = 3
